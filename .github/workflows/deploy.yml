name: Deploy
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
permissions:
  contents: read
  packages: write
concurrency:
  group: production
  cancel-in-progress: false
jobs:
  build-and-deploy:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Normalize image repository
        id: image
        shell: bash
        run: echo "repository=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ai-research-assistant/backend
          push: true
          tags: ${{ steps.image.outputs.repository }}/backend:${{ github.event.workflow_run.head_sha }}
      - uses: docker/build-push-action@v6
        with:
          context: ai-research-assistant/frontend
          push: true
          tags: ${{ steps.image.outputs.repository }}/frontend:${{ github.event.workflow_run.head_sha }}
      - name: Deploy with automatic rollback
        uses: appleboy/ssh-action@v1.2.2
        env:
          IMAGE_TAG: ${{ github.event.workflow_run.head_sha }}
          IMAGE_REPOSITORY: ${{ steps.image.outputs.repository }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: IMAGE_TAG,IMAGE_REPOSITORY
          script: /opt/ai-research-assistant/scripts/deploy.sh
