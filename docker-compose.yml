services:
  backend:
    build: ./ai-research-assistant/backend
    env_file:
      - ./ai-research-assistant/backend/.env.example
    environment:
      CHROMA_DIR: /app/chroma_db
      HISTORY_DIR: /app/history
      UPLOAD_DIR: /app/uploads
      ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173,http://localhost:8080
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    volumes:
      - backend_chroma:/app/chroma_db
      - backend_history:/app/history
      - backend_uploads:/app/uploads
    depends_on:
      redis:
        condition: service_healthy

  worker:
    build: ./ai-research-assistant/backend
    command: rq worker --url redis://redis:6379/0 pdf-indexing
    env_file:
      - ./ai-research-assistant/backend/.env.example
    environment:
      CHROMA_DIR: /app/chroma_db
      HISTORY_DIR: /app/history
      UPLOAD_DIR: /app/uploads
      REDIS_URL: redis://redis:6379/0
    volumes:
      - backend_chroma:/app/chroma_db
      - backend_history:/app/history
      - backend_uploads:/app/uploads
    depends_on:
      redis:
        condition: service_healthy

  redis:
    image: redis:8.2-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  frontend:
    build:
      context: ./ai-research-assistant/frontend
      args:
        VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  backend_chroma:
  backend_history:
  backend_uploads:
  redis_data:
