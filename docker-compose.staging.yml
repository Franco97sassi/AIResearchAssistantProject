services:
  backend:
    restart: unless-stopped
    env_file:
      - ./ai-research-assistant/backend/.env.staging.example
    environment:
      CHROMA_DIR: /app/data/chroma
      HISTORY_DIR: /app/data/history
      UPLOAD_DIR: /app/data/uploads
      METRICS_DB_PATH: /app/data/logs/metrics.sqlite3
    volumes:
      - staging_data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    restart: unless-stopped

volumes:
  staging_data:
