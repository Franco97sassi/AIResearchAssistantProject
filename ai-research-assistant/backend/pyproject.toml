[project]
name = "ai-research-assistant-backend"
version = "1.0.0"
description = "FastAPI backend for a PDF research assistant powered by RAG."
requires-python = ">=3.12"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "--strict-markers --cov=app --cov-report=term-missing --cov-report=xml --cov-fail-under=75"
markers = ["adversarial: abuse, injection, and boundary security tests"]

[tool.coverage.run]
branch = true
source = ["app"]
omit = ["app/mcp_server.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = [
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"app/main.py" = ["B008"]
"tests/*" = ["B011"]

[tool.mypy]
python_version = "3.12"
files = ["app"]
check_untyped_defs = true
ignore_missing_imports = true
no_implicit_optional = true
show_error_codes = true
warn_redundant_casts = true
warn_unused_ignores = true
exclude = ["app/mcp_server.py"]

[[tool.mypy.overrides]]
module = ["app.rag"]
disable_error_code = ["arg-type", "assignment", "index", "union-attr"]

[[tool.mypy.overrides]]
module = ["app.agent"]
disable_error_code = ["arg-type"]

[[tool.mypy.overrides]]
module = ["app.main"]
disable_error_code = ["assignment"]
