groups:
  - name: ai-assistant
    rules:
      - alert: BackendDown
        expr: up{job="ai-research-assistant"} == 0
        for: 2m
        labels: {severity: critical}
        annotations: {summary: "Backend unavailable for two minutes"}
      - alert: HighAverageLatency
        expr: ai_request_latency_milliseconds > 2000
        for: 10m
        labels: {severity: warning}
        annotations: {summary: "Average request latency exceeds 2 seconds"}
      - alert: UnexpectedDailyCost
        expr: increase(ai_estimated_cost_usd_total[24h]) > 10
        labels: {severity: warning}
        annotations: {summary: "Estimated model spend exceeded USD 10 in 24 hours"}
